<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Orders — Zoro Luna Admin</title>
<link rel="icon" href="img/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem("zl_theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="site.css">
<link rel="stylesheet" href="admin.css">
</head>
<body class="adm">

<!-- LOGIN -->
<section id="login" class="login">
  <form id="lf" class="login-card" autocomplete="off">
    <img src="img/logo.jpg" alt="" width="56" height="56">
    <h1>Zoro Luna <em class="gold">Orders</em></h1>
    <p class="sub">Sign in to manage your orders.</p>
    <label class="fld">Backend URL<input id="l-api" placeholder="https://script.google.com/macros/s/…/exec" inputmode="url"></label>
    <label class="fld">Admin key<input id="l-key" type="password" autocomplete="current-password"></label>
    <label class="chk-row"><input type="checkbox" id="l-rem" checked> Keep me signed in on this device</label>
    <div class="msg" id="l-msg" role="alert"></div>
    <button class="btn solid block" type="submit">Sign in</button>
    <button class="btn ghost block" type="button" id="l-demo">Try demo mode (sample data)</button>
    <p class="note">Not set up yet? Follow <b>SETUP.md</b> — it takes about 10 minutes.</p>
  </form>
</section>

<!-- APP -->
<div id="app" hidden>
  <header class="a-top">
    <div class="a-brand"><img src="img/logo.jpg" alt="" width="34" height="34"><span>Zoro Luna <small>Orders</small></span><span class="pill" id="demoPill" hidden>Demo</span></div>
    <div class="a-actions">
      <span class="a-upd" id="upd"></span>
      <button class="ib" id="bell" title="Order alerts" aria-label="Order alerts"><svg viewBox="0 0 24 24"><path d="M6 9a6 6 0 1 1 12 0c0 5 2 6 2 6H4s2-1 2-6Z"/><path d="M10 19a2 2 0 0 0 4 0"/></svg><i id="bellOn"></i></button>
      <button class="ib" id="refresh" title="Refresh" aria-label="Refresh"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.5-5.8M20 4v5h-5"/></svg></button>
      <button class="ib" id="theme" title="Theme" aria-label="Switch theme"><svg class="ic-moon" viewBox="0 0 24 24"><path d="M16.8 2.6A9.6 9.6 0 1 0 21.4 16.4 7.6 7.6 0 0 1 16.8 2.6Z"/></svg><svg class="ic-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      <button class="btn ghost sm" id="logout">Sign out</button>
    </div>
  </header>

  <main class="a-wrap">
    <div class="a-stats" id="stats"></div>

    <div class="a-bar">
      <input class="a-search" id="q" type="search" placeholder="Search order ID, name, phone, city…" aria-label="Search orders">
      <div class="a-bar-r">
        <button class="btn ghost sm" id="sim" hidden>+ Test order</button>
        <button class="btn ghost sm" id="csv">Export CSV</button>
      </div>
    </div>
    <div class="a-chips" id="chips"></div>

    <div class="a-list" id="list" role="table" aria-label="Orders"></div>
  </main>

  <div class="a-ov" id="ov"></div>
  <aside class="a-drawer" id="dr" aria-label="Order details"></aside>
</div>

<div class="toast" id="toast" role="status"></div>
<script src="config.js"></script>
<script src="admin.js"></script>
</body>
</html>
